<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KeyDPrint</title>
<link rel="icon" href="pictures/logo.png">

<style>
/* ================= RESET ================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: Calibri, sans-serif;
  line-height: 1.4;
}

/* ================= NAV ================= */
.topnav {
  position: fixed;
  top: 0;
  width: 100%;
  background: linear-gradient(145deg, rgb(241,135,1), rgb(243,91,4));
  display: flex;
  align-items: center;
  padding: .5rem 1rem;
  z-index: 1000;
}
.topnav img {
  height: 2rem;
}
.nav-toggle {
  margin-left: auto;
  font-size: 1.8rem;
  color: white;
  cursor: pointer;
  display: block;
}
.nav-links {
  display: none;
  flex-direction: column;
  width: 100%;
  background: inherit;
}
.nav-links a {
  color: white;
  padding: .75rem;
  text-decoration: none;
  font-weight: bold;
}
.nav-links a:hover {
  background: rgba(255,255,255,.2);
}

/* ================= HERO ================= */
.covimg {
  margin-top: 3.5rem;
  min-height: 100vh;
  background: url('pictures/largimgkeyd.jpg') center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 1rem;
  color: white;
}
.bbb {
  display: inline-block;
  margin-top: 1rem;
  background: #7678ed;
  padding: .75rem 1.5rem;
  border-radius: 2rem;
  color: white;
  text-decoration: none;
}

/* ================= SECTIONS ================= */
section {
  padding: 3rem 1rem;
}
.article {
  max-width: 900px;
  margin: auto;
  text-align: center;
}

/* ================= GRID ================= */
.imgatc {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1.5rem;
  margin-top: 2rem;
}
.atcpht img {
  width: 100%;
  max-width: 280px;
  border-radius: 1.5rem;
}

/* ================= SOCIALS ================= */
.tsn {
  display: flex;
  overflow-x: auto;
  background: rgb(61,52,139);
}
.scmbtn {
  border: none;
  background: none;
  color: white;
  padding: 1rem;
  cursor: pointer;
  white-space: nowrap;
}
.tabcontent {
  display: none;
  background: white;
  padding: 1rem;
  border-radius: 1rem;
  margin-top: 1rem;
}

/* ================= FOOTER ================= */
.bkfst {
  background: rgb(61,52,139);
  color: white;
  text-align: center;
  padding: 2rem 1rem;
}

/* ================= DESKTOP ================= */
@media (min-width: 768px) {
  .nav-toggle { display: none; }
  .nav-links {
    display: flex !important;
    flex-direction: row;
    margin-left: auto;
    width: auto;
  }
  .imgatc {
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
  }
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="topnav">
  <a href="#home"><img src="pictures/logo.png" alt="logo"></a>
  <div class="nav-toggle" onclick="toggleNav()">☰</div>
  <div class="nav-links" id="navLinks">
    <a href="#produkter">Produkt</a>
    <a href="#tinker">Modeller</a>
    <a href="#socials">Medier</a>
    <a href="#contacts">Kontakt</a>
  </div>
</nav>

<!-- HERO -->
<div id="home" class="covimg">
  <div>
    <h1>KeyDPrint</h1>
    <h2>3D‑printende bedrift</h2>
    <p>Vi kan 3D‑print</p>
    <a href="#produkter" class="bbb">Se våre ting</a>
  </div>
</div>

<!-- PRODUKTER -->
<section id="produkter">
  <div class="article">
    <h1>Produkter</h1>
    <div class="imgatc">
      <div class="atcpht">
        <img src="pictures/keychain.jpg">
        <h2>Nøkkelanheng</h2>
      </div>
      <div class="atcpht">
        <img src="pictures/printpris.jpg">
        <h2>Pris</h2>
      </div>
      <div class="atcpht">
        <img src="pictures/annet.jpg">
        <h2>Annet</h2>
      </div>
    </div>
  </div>
</section>

<!-- SOCIALS -->
<section id="socials">
  <div class="article">
    <h1>Sosiale medier</h1>
    <div class="tsn">
      <button class="scmbtn" onclick="openTab('nytt')">Nytt</button>
      <button class="scmbtn" onclick="openTab('yt')">YouTube</button>
      <button class="scmbtn" onclick="openTab('ig')">Instagram</button>
    </div>

    <div id="nytt" class="tabcontent">
      <h3>Nyheter</h3>
      <p>Første video er lagt ut!</p>
    </div>
    <div id="yt" class="tabcontent">
      <p>YouTube: @keydprint</p>
    </div>
    <div id="ig" class="tabcontent">
      <p>Instagram kommer</p>
    </div>
  </div>
</section>

<!-- CONTACT -->
<section id="contacts">
  <div class="bkfst">
    <p>Email: filamentum49@gmail.com</p>
    <p>Tlf: 94 85 75 28</p>
  </div>
</section>

<script>
function toggleNav(){
  const nav=document.getElementById("navLinks");
  nav.style.display = nav.style.display==="flex" ? "none":"flex";
}
function openTab(id){
  document.querySelectorAll(".tabcontent").forEach(t=>t.style.display="none");
  document.getElementById(id).style.display="block";
}
openTab("nytt");
</script>

</body>
</html>
``
